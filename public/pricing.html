<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarifs - TechnoServ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-cpu-fill me-2"></i>TechnoServ</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="/about.html">À propos</a></li>
            <li class="nav-item"><a class="nav-link active" href="/pricing.html">Tarifs</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="/pay.html">Payer</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-theme" class="btn-theme"></button>
            <span id="zone-auth"></span>
          </div>
        </div>
      </div>
    </nav>

    <header class="hero" style="padding: 4rem 0">
      <div class="container">
        <h1>Nos tarifs</h1>
        <p>Sélectionnez un ou plusieurs services et passez commande en toute simplicité.</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <!-- Baro rechèch ak filtraj -->
        <div class="row mb-4 g-2">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="recherche" class="form-control" placeholder="Rechercher un service..." />
            </div>
          </div>
          <div class="col-md-4">
            <select id="filtre-categorie" class="form-select">
              <option value="">Toutes les catégories</option>
            </select>
          </div>
          <div class="col-md-2">
            <button id="btn-filtrer" class="btn btn-primaire w-100"><i class="bi bi-funnel me-1"></i>Filtrer</button>
          </div>
        </div>

        <!-- Lis sèvis yo -->
        <div class="row g-4" id="zone-services">
          <p class="text-center text-muted">Chargement des services...</p>
        </div>
      </div>
    </section>

    <!-- Baro rezime seleksyon an (parèt lè gen sèvis chwazi) -->
    <div id="baro-selection" class="fixed-bottom bg-white border-top shadow-lg p-3" style="display: none">
      <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <span id="nb-selection" class="fw-bold">0</span> service(s) sélectionné(s) —
          Total : <span id="total-selection" class="fw-bold text-primary">0.00 $</span>
        </div>
        <button id="btn-commander" class="btn btn-accent"><i class="bi bi-cart-check me-2"></i>Commander</button>
      </div>
    </div>

    <footer class="footer" style="margin-bottom: 80px">
      <div class="container">
        <p class="text-center mb-0">&copy; 2026 TechnoServ. Tous droits réservés.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/commun.js"></script>
    <script src="/js/tarifs.js"></script>
  </body>
</html>
