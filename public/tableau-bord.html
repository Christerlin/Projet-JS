<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon espace - NovaTech</title>
    <link rel="icon" href="/images/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="Logo NovaTech" />
            <div class="logo-text">
              <span class="logo-nom">Nova<span>Tech</span></span>
              <p>Solutions informatiques</p>
            </div>
          </a>
        </div>

        <nav id="menu-principal">
          <ul>
            <li><a class="nav-link" href="/">Accueil</a></li>
            <li><a class="nav-link" href="/about.html">À propos</a></li>
            <li><a class="nav-link" href="/pricing.html">Tarifs</a></li>
            <li><a class="nav-link" href="/contact.html">Contact</a></li>
            <li><a class="nav-link" href="/pay.html">Payer</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button id="btn-theme" class="btn-theme" aria-label="Changer de thème"></button>
          <span id="zone-auth"></span>
        </div>

        <button class="bouton-hamburger" id="boutonHamburger" aria-label="Menu"
                aria-expanded="false" aria-controls="menu-principal">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <section class="section" style="padding-top: 2rem">
      <div class="container">
        <h2 class="mb-4"><i class="bi bi-person-circle me-2"></i>Mon espace client</h2>

        <ul class="nav nav-tabs mb-4" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-commandes">Mes commandes</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-profil">Mon profil</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-temoignage">Laisser un avis</button></li>
        </ul>

        <div class="tab-content">
          <!-- Kòmand yo -->
          <div class="tab-pane fade show active" id="tab-commandes">
            <div class="table-responsive table-custom">
              <table class="table table-hover mb-0">
                <thead><tr><th>Commande</th><th>Date</th><th>Montant</th><th>Statut</th><th>Action</th></tr></thead>
                <tbody id="tbody-commandes"></tbody>
              </table>
            </div>
          </div>

          <!-- Pwofil -->
          <div class="tab-pane fade" id="tab-profil">
            <div class="carte">
              <div id="message-profil"></div>
              <form id="form-profil">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Nom</label><input type="text" name="nom" class="form-control" /></div>
                  <div class="col-md-6"><label class="form-label">Prénom</label><input type="text" name="prenom" class="form-control" /></div>
                  <div class="col-md-6"><label class="form-label">Téléphone</label><input type="tel" name="telephone" class="form-control" /></div>
                  <div class="col-md-6"><label class="form-label">Adresse</label><input type="text" name="adresse" class="form-control" /></div>
                  <div class="col-md-6"><label class="form-label">Entreprise</label><input type="text" name="entreprise" class="form-control" /></div>
                  <div class="col-md-6"><label class="form-label">Ville</label><input type="text" name="ville" class="form-control" /></div>
                  <div class="col-md-6"><label class="form-label">Pays</label><input type="text" name="pays" class="form-control" /></div>
                  <div class="col-12"><button type="submit" class="btn btn-primaire"><i class="bi bi-save me-2"></i>Enregistrer</button></div>
                </div>
              </form>
            </div>
          </div>

          <!-- Temwayaj -->
          <div class="tab-pane fade" id="tab-temoignage">
            <div class="carte">
              <div id="message-temoignage"></div>
              <form id="form-temoignage">
                <div class="mb-3">
                  <label class="form-label">Note</label>
                  <select name="note" class="form-select">
                    <option value="5">5 étoiles - Excellent</option>
                    <option value="4">4 étoiles - Très bien</option>
                    <option value="3">3 étoiles - Bien</option>
                    <option value="2">2 étoiles - Moyen</option>
                    <option value="1">1 étoile - Insuffisant</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Votre commentaire</label>
                  <textarea name="commentaire" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primaire"><i class="bi bi-star me-2"></i>Envoyer mon avis</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/commun.js"></script>
    <script src="/js/tableau-bord.js"></script>
  </body>
</html>
