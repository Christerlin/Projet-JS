<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration - NovaTech</title>
    <link rel="icon" href="/images/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
    <!-- Chart.js pou graf estatistik yo (bonis) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="Logo NovaTech" />
            <div class="logo-text">
              <span class="logo-nom">Nova<span>Tech</span></span>
              <p>Solutions informatiques</p>
            </div>
          </a>
        </div>

      <div class="header-actions">
        <span class="badge bg-primary">Admin</span>
        <button id="btn-theme" class="btn-theme" aria-label="Changer de thème"></button>
        <span id="zone-auth"></span>
      </div>
      </div>
    </header>

    <section class="section" style="padding-top: 2rem">
      <div class="container">
        <h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Tableau de bord administrateur</h2>

        <!-- Kat estatistik yo -->
        <div class="row g-3 mb-4" id="zone-stats"></div>

        <!-- Graf -->
        <div class="row g-4 mb-4">
          <div class="col-lg-6">
            <div class="carte"><h5>Aperçu général</h5><canvas id="graf-general"></canvas></div>
          </div>
        </div>

        <!-- Onglè jesyon yo -->
        <ul class="nav nav-tabs mb-4" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-services">Services</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-utilisateurs">Utilisateurs</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-paiements">Paiements</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-messages">Messages</button></li>
        </ul>

        <div class="tab-content">
          <!-- Jesyon sèvis -->
          <div class="tab-pane fade show active" id="tab-services">
            <div class="d-flex justify-content-between mb-3">
              <h4>Gestion des services</h4>
              <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#modal-service" id="btn-nouveau-service">
                <i class="bi bi-plus-circle me-2"></i>Nouveau service
              </button>
            </div>
            <div class="table-responsive table-custom">
              <table class="table table-hover mb-0">
                <thead><tr><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Statut</th><th>Actions</th></tr></thead>
                <tbody id="tbody-services"></tbody>
              </table>
            </div>
          </div>

          <!-- Jesyon itilizatè -->
          <div class="tab-pane fade" id="tab-utilisateurs">
            <h4 class="mb-3">Gestion des utilisateurs</h4>
            <div class="table-responsive table-custom">
              <table class="table table-hover mb-0">
                <thead><tr><th>Nom</th><th>Courriel</th><th>Rôle</th><th>Statut</th><th>Actions</th></tr></thead>
                <tbody id="tbody-utilisateurs"></tbody>
              </table>
            </div>
          </div>

          <!-- Peman -->
          <div class="tab-pane fade" id="tab-paiements">
            <h4 class="mb-3">Historique des paiements</h4>
            <div class="table-responsive table-custom">
              <table class="table table-hover mb-0">
                <thead><tr><th>Client</th><th>Commande</th><th>Montant</th><th>Mode</th><th>Date</th><th>Statut</th></tr></thead>
                <tbody id="tbody-paiements"></tbody>
              </table>
            </div>
          </div>

          <!-- Mesaj -->
          <div class="tab-pane fade" id="tab-messages">
            <h4 class="mb-3">Messages reçus</h4>
            <div id="zone-messages" class="row g-3"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal ajoute/modifye sèvis -->
    <div class="modal fade" id="modal-service" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titre-modal-service">Nouveau service</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="form-service">
              <input type="hidden" name="id_service" />
              <div class="mb-3"><label class="form-label">Nom du service</label><input type="text" name="nom_service" class="form-control" required /></div>
              <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
              <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Prix ($)</label><input type="number" step="0.01" name="prix" class="form-control" required /></div>
                <div class="col-md-6 mb-3"><label class="form-label">Catégorie</label><input type="text" name="categorie" class="form-control" /></div>
              </div>
              <button type="submit" class="btn btn-primaire w-100">Enregistrer</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Notifikasyon an tan reyèl yo parèt isit la -->
    <div id="zone-notifications" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/commun.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
