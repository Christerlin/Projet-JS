<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - NovaTech</title>
    <link rel="icon" href="/images/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="Logo NovaTech" />
            <div class="logo-text">
              <span class="logo-nom">Nova<span>Tech</span></span>
              <p>Solutions informatiques</p>
            </div>
          </a>
        </div>

        <nav id="menu-principal">
          <ul>
            <li><a class="nav-link" href="/">Accueil</a></li>
            <li><a class="nav-link" href="/about.html">À propos</a></li>
            <li><a class="nav-link" href="/pricing.html">Tarifs</a></li>
            <li><a class="nav-link" href="/contact.html">Contact</a></li>
            <li><a class="nav-link" href="/pay.html">Payer</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button id="btn-theme" class="btn-theme" aria-label="Changer de thème"></button>
          <span id="zone-auth"></span>
        </div>

        <button class="bouton-hamburger" id="boutonHamburger" aria-label="Menu"
                aria-expanded="false" aria-controls="menu-principal">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="carte">
              <!-- Zòn alèt pou mesaj erè/siksè -->
              <div id="message-alerte"></div>

              <!-- Onglè koneksyon / enskripsyon -->
              <ul class="nav nav-pills nav-justified mb-4" role="tablist">
                <li class="nav-item">
                  <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#onglet-connexion">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Connexion
                  </button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" data-bs-toggle="pill" data-bs-target="#onglet-inscription">
                    <i class="bi bi-person-plus me-1"></i>Inscription
                  </button>
                </li>
              </ul>

              <div class="tab-content">
                <!-- Fòm koneksyon -->
                <div class="tab-pane fade show active" id="onglet-connexion">
                  <form id="form-connexion">
                    <div class="mb-3">
                      <label class="form-label">Courriel</label>
                      <input type="email" name="email" class="form-control" required />
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Mot de passe</label>
                      <input type="password" name="mot_de_passe" class="form-control" required />
                    </div>
                    <button type="submit" class="btn btn-primaire w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Se connecter</button>
                  </form>
                </div>

                <!-- Fòm enskripsyon -->
                <div class="tab-pane fade" id="onglet-inscription">
                  <form id="form-inscription">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" required />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" required />
                      </div>
                      <div class="col-12">
                        <label class="form-label">Courriel</label>
                        <input type="email" name="email" class="form-control" required />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="mot_de_passe" class="form-control" required minlength="6" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Téléphone</label>
                        <div class="input-group"><span class="input-group-text">+509</span><input type="tel" name="telephone" class="form-control" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" placeholder="34567890" title="8 chiffres, sans l'indicatif" /></div>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Entreprise</label>
                        <input type="text" name="entreprise" class="form-control" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Ville</label>
                        <input type="text" name="ville" class="form-control" />
                      </div>
                      <div class="col-12">
                        <button type="submit" class="btn btn-primaire w-100"><i class="bi bi-person-plus me-2"></i>Créer mon compte</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>

              <p class="text-center text-muted mt-3 mb-0">
                <small>Compte de démonstration admin : admin@entreprise.ht / admin123</small>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/commun.js"></script>
    <script src="/js/authentification.js"></script>
  </body>
</html>
