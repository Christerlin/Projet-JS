<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - TechnoServ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-cpu-fill me-2"></i>TechnoServ</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="/about.html">À propos</a></li>
            <li class="nav-item"><a class="nav-link" href="/pricing.html">Tarifs</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="/pay.html">Payer</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-theme" class="btn-theme"></button>
            <span id="zone-auth"></span>
          </div>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="carte">
              <!-- Zòn alèt pou mesaj erè/siksè -->
              <div id="message-alerte"></div>

              <!-- Onglè koneksyon / enskripsyon -->
              <ul class="nav nav-pills nav-justified mb-4" role="tablist">
                <li class="nav-item">
                  <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#onglet-connexion">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Connexion
                  </button>
                </li>
                <li class="nav-item">
                  <button class="nav-link" data-bs-toggle="pill" data-bs-target="#onglet-inscription">
                    <i class="bi bi-person-plus me-1"></i>Inscription
                  </button>
                </li>
              </ul>

              <div class="tab-content">
                <!-- Fòm koneksyon -->
                <div class="tab-pane fade show active" id="onglet-connexion">
                  <form id="form-connexion">
                    <div class="mb-3">
                      <label class="form-label">Courriel</label>
                      <input type="email" name="email" class="form-control" required />
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Mot de passe</label>
                      <input type="password" name="mot_de_passe" class="form-control" required />
                    </div>
                    <button type="submit" class="btn btn-primaire w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Se connecter</button>
                  </form>
                </div>

                <!-- Fòm enskripsyon -->
                <div class="tab-pane fade" id="onglet-inscription">
                  <form id="form-inscription">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" required />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" required />
                      </div>
                      <div class="col-12">
                        <label class="form-label">Courriel</label>
                        <input type="email" name="email" class="form-control" required />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="mot_de_passe" class="form-control" required minlength="6" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Téléphone</label>
                        <input type="tel" name="telephone" class="form-control" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Entreprise</label>
                        <input type="text" name="entreprise" class="form-control" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Ville</label>
                        <input type="text" name="ville" class="form-control" />
                      </div>
                      <div class="col-12">
                        <button type="submit" class="btn btn-primaire w-100"><i class="bi bi-person-plus me-2"></i>Créer mon compte</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>

              <p class="text-center text-muted mt-3 mb-0">
                <small>Compte de démonstration admin : admin@entreprise.ht / admin123</small>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/commun.js"></script>
    <script src="/js/authentification.js"></script>
  </body>
</html>
