<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paiement - NovaTech</title>
    <link rel="icon" href="/images/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
    <!-- Bibliyotèk Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">
          <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="Logo NovaTech" />
            <div class="logo-text">
              <span class="logo-nom">Nova<span>Tech</span></span>
              <p>Solutions informatiques</p>
            </div>
          </a>
        </div>

        <nav id="menu-principal">
          <ul>
            <li><a class="nav-link" href="/">Accueil</a></li>
            <li><a class="nav-link" href="/about.html">À propos</a></li>
            <li><a class="nav-link" href="/pricing.html">Tarifs</a></li>
            <li><a class="nav-link" href="/contact.html">Contact</a></li>
            <li><a class="nav-link active" href="/pay.html">Payer</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button id="btn-theme" class="btn-theme" aria-label="Changer de thème"></button>
          <span id="zone-auth"></span>
        </div>

        <button class="bouton-hamburger" id="boutonHamburger" aria-label="Menu"
                aria-expanded="false" aria-controls="menu-principal">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <section class="hero" style="padding: 4rem 0">
      <div class="container">
        <h1>Paiement sécurisé</h1>
        <p>Réglez vos services en toute sécurité grâce à Stripe.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-7">
            <!-- Zòn kontni prensipal (chaje dinamikman) -->
            <div id="zone-paiement">
              <p class="text-center text-muted">Chargement...</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container text-center">
        <img src="/images/logo.png" alt="Logo NovaTech" class="footer-logo" />
        <p class="mb-0">&copy; 2026 NovaTech. Tous droits réservés.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/commun.js"></script>
    <script src="/js/paiement.js"></script>
